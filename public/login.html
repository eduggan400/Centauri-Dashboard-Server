<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edge Server Login</title>
    <!-- Google Fonts Preconnect for Speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Single Shared Stylesheet -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="glass-panel">
    <div class="panel-header">
        <h2>Edge Server</h2>
        <span class="status-badge pulse">LOCKED</span>
    </div>

    <div id="errorBox" class="error-box"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">USERNAME</label>
            <input type="text" id="username" name="username" required autocomplete="off" placeholder="Enter username">
        </div>

        <div class="form-group">
            <label for="password">PASSWORD</label>
            <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>

        <button type="submit" class="btn">AUTHENTICATE</button>
    </form>
</div>

<script>
    const loginForm = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      errorBox.style.display = 'none';
      errorBox.textContent = '';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          window.location.href = data.redirect || '/';
        } else {
          errorBox.textContent = data.message || 'Authentication failed. Check credentials.';
          errorBox.style.display = 'block';
        }
      } catch (err) {
        errorBox.textContent = 'Server connection error. Please try again.';
        errorBox.style.display = 'block';
      }
    });
</script>

</body>
</html>
