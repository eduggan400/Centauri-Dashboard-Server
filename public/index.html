<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edge-Server Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="glass-panel">
    <h2>Edge-Server Login</h2>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required value="admin">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required value="secret123">
        </div>
        <button type="submit" class="btn">Authenticate</button>
    </form>
    <div id="errorMsg" style="color: #f87171; margin-top: 1rem; display: none;"></div>
</div>
<script src="app.js"></script>
</body>
</html>
